<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verge</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro-loader">
        <h1 class="name">WELCOME TO VERGE</h1>
    </div> 
    
    <div class="app-wrapper" id="app-wrapper">
        <button type="button" id="theme-toggle" class="material-symbols-rounded">
            toggle_on
        </button>

        <!-- Main Content & Chat History -->
        <div class="main-content-area">
            <div class="welcome-banner" id="welcome-banner">
                <h1 class="heading">How can I help you?</h1>   
                <h2 class="sub-heading">Ask me something</h2>
            </div>
            
            <div class="chat-history" id="chat-history"></div>
        </div>
        
        <!-- Prompt Container  -->
        <div class="prompt-container">
            <div class="prompt-wrapper">
                <form action="#" class="prompt-form">
                    <input type="file" id="real-file" hidden="hidden" />
                    <button type="button" id="custom-publish-btn" class="icon-btn material-symbols-rounded">publish</button>
                    
                    <input type="text" placeholder="Ask Verge" class="prompt-input" required>
                    
                    <div class="right-actions">
                        <div class="model-selector-container">
                            <span class="model-selector" id="model-selector-btn">
                                <span id="current-model">Gemini Flash</span> 
                                <span class="material-symbols-rounded">expand_more</span>
                            </span>
                            </div>
                        </div>

                        <button type="button" class="icon-btn material-symbols-rounded">mic</button>
                        <button type="submit" class="icon-btn submit-btn material-symbols-rounded">arrow_upward</button>
                    </div>
                </form>
                
                <div class="suggestion-chips" id="suggestion-chips">
                    <button class="chip">Help me debug HTML</button>
                    <button class="chip">Write a CSS grid layout</button>
                    <button class="chip">Explain JavaScript promises</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="script.js"></script> 
</body>
</html>
